name: Publish selected India Racing Cycles desktop cover

on:
  push:
    paths:
      - ".upload-tmp/hero-cover-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Assemble desktop cover image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          cat .upload-tmp/hero-cover-part-*.txt | tr -d '\r\n' | base64 --decode > assets/images/hero-taj-mahal-desktop.webp
          test "$(wc -c < assets/images/hero-taj-mahal-desktop.webp)" -gt 15000
          file assets/images/hero-taj-mahal-desktop.webp
          rm -rf .upload-tmp

      - name: Commit the selected desktop cover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/hero-taj-mahal-desktop.webp .upload-tmp
          git commit -m "Set selected India Racing Cycles desktop cover"
          git push
