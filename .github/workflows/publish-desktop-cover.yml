name: Publish desktop cover
on:
  push:
    branches: [main]
    paths:
      - ".upload-tmp/trigger.txt"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate WebP
        run: |
          mkdir -p assets/images
          cat .upload-tmp/hero-cover-part-*.txt | tr -d '\r\n' | base64 --decode > assets/images/hero-taj-mahal-desktop.webp
          python - <<'PY'
          from pathlib import Path
          path = Path("assets/images/hero-taj-mahal-desktop.webp")
          data = path.read_bytes()
          assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", "Invalid WebP file"
          assert len(data) == 64642, f"Unexpected image size: {len(data)}"
          print("Validated desktop WebP:", len(data), "bytes")
          PY
          file assets/images/hero-taj-mahal-desktop.webp
      - name: Commit image and remove temporary upload files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .upload-tmp
          rm -f .github/workflows/publish-desktop-cover.yml
          git add -A assets/images/hero-taj-mahal-desktop.webp .upload-tmp .github/workflows/publish-desktop-cover.yml
          git commit -m "Update India Racing Cycles desktop cover"
          git push
